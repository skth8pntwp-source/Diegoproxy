<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D26 OS</title>
    <style>
        :root {
            --glass-bg: rgba(20, 20, 20, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #fff;
            --text-muted: #aaa;
            --highlight: #00ffcc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
            color: var(--text-main);
        }

        /* --- Video Background --- */
        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translateX(-50%) translateY(-50%);
            z-index: -1;
            object-fit: cover;
            pointer-events: none;
        }

        /* --- Boot Sequence Styles --- */
        #boot-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease-out;
        }

        #win-logo {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            width: 60px;
            height: 60px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .win-square { background-color: #fff; width: 100%; height: 100%; }

        #boot-text {
            position: absolute;
            top: 30px;
            left: 30px;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            white-space: pre-wrap;
            text-align: left;
            width: 100%;
            display: none; 
        }

        #boot-logo-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #fff; 
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        #boot-logo {
            font-size: 150px;
            color: #000;
            font-family: 'Segoe UI', sans-serif;
            font-weight: 200;
            letter-spacing: -5px;
        }

        /* Desktop Layout */
        #desktop {
            position: relative;
            width: 100%;
            height: calc(100% - 50px);
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 20px;
        }

        .desktop-icon {
            width: 80px;
            text-align: center;
            cursor: pointer;
            border-radius: 8px;
            padding: 10px 5px;
            transition: background 0.2s;
        }

        .desktop-icon:hover { background: rgba(255, 255, 255, 0.1); }

        .desktop-icon img {
            width: 48px;
            height: 48px;
            margin-bottom: 5px;
            border-radius: 12px;
            background: rgba(0,0,0,0.5);
        }

        .desktop-icon span {
            font-size: 12px;
            text-shadow: 1px 1px 2px #000;
        }

        /* Center Widget */
        .center-widget {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            background: var(--glass-bg);
            padding: 20px 40px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            width: 400px;
        }

        .widget-close {
            position: absolute;
            top: 15px;
            right: 20px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 16px;
            transition: color 0.2s;
        }

        .widget-close:hover { color: #ff5f56; }

        .center-widget h1 { font-size: 48px; font-weight: 300; margin-bottom: 5px; }
        .center-widget p { color: var(--text-muted); font-size: 14px; margin-bottom: 15px; }

        /* Window System */
        .window {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 900px;
            height: 70%;
            background: rgba(30, 30, 30, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            display: none;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            overflow: hidden;
            z-index: 100;
        }

        .window.active { display: flex; }

        .window-header {
            background: rgba(42, 42, 42, 0.8);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
        }

        .window-controls span {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-left: 8px;
            cursor: pointer;
        }

        .btn-close { background: #ff5f56; }
        .btn-min { background: #ffbd2e; }
        .btn-max { background: #27c93f; }

        .window-content { padding: 20px; overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column; }

        /* Iframe Specific Window Overrides */
        #iframe-window .window-content { padding: 0; }
        #browser-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }

        /* Game Grid */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
        }

        .game-card {
            background: rgba(42, 42, 42, 0.7);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            color: white;
            font-size: 11px;
            transition: transform 0.2s, background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 80px;
            word-break: break-all;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .game-card:hover {
            transform: translateY(-3px);
            background: var(--highlight);
            color: #000;
            font-weight: bold;
        }

        /* Taskbar */
        .taskbar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            justify-content: space-between;
        }

        .taskbar-left, .taskbar-right { display: flex; align-items: center; gap: 15px; font-size: 14px; }
        .taskbar-icons { display: flex; gap: 10px; }
        .taskbar-icon {
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .taskbar-icon:hover { background: rgba(255, 255, 255, 0.3); }
    </style>
</head>

        const bootCode = `struct group_info init_groups = { .usage = ATOMIC_INIT(2) };
struct group_info *groups_alloc(int gidsetsize){
    struct group_info *group_info;
    int`;

        const winLogoEl = document.getElementById('win-logo');
        const bootTextEl = document.getElementById('boot-text');
        const bootLogoCont = document.getElementById('boot-logo-container');
        const bootScreen = document.getElementById('boot-screen');
        let typeIndex = 0;

        function startBootSequence() {
            setTimeout(() => {
                winLogoEl.style.display = 'none';
                bootTextEl.style.display = 'block';
                typeBootCode();
            }, 1500);
        }

        function typeBootCode() {
            if (typeIndex < bootCode.length) {
                bootTextEl.textContent += bootCode.charAt(typeIndex);
                typeIndex++;
                setTimeout(typeBootCode, 15); 
            } else {
                setTimeout(showBootLogo, 600); 
            }
        }

        function showBootLogo() {
            bootTextEl.style.display = 'none'; 
            bootLogoCont.style.opacity = '1';  
            
            setTimeout(() => {
                bootLogoCont.style.opacity = '0'; 
                setTimeout(() => {
                    bootScreen.style.opacity = '0'; 
                    setTimeout(() => {
                        bootScreen.style.display = 'none'; 
                    }, 800);
                }, 500);
            }, 1800); 
        }

        window.onload = startBootSequence;

        // --- 2. Clock Logic ---
        function updateTime() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; 
            minutes = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('clock').textContent = hours + ':' + minutes + ' ' + ampm;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // --- 3. Widget Toggle Logic ---
        function toggleWidget() {
            const widget = document.getElementById('main-widget');
            widget.style.display = widget.style.display === 'none' ? 'block' : 'none';
        }

        // --- 4. Window Management ---
        function openWindow(id) { document.getElementById(id).classList.add('active'); }
        function closeWindow(id) { 
            document.getElementById(id).classList.remove('active');
            if (id === 'iframe-window') {
                document.getElementById('browser-frame').src = ''; // Clear iframe when closed
            }
        }

        function launchInIframe(url, name) {
            document.getElementById('iframe-title').textContent = name;

                href = 'https://' + href;
            } else if (href.startsWith('bit.ly')) {
                href = 'https://' + href;
            }
            
            card.className = "game-card";
            
            let displayName = link.replace('https://', '').replace('http://', '').split('/')[0];

                displayName = "Proxy Node " + (index + 1);
            }
            card.textContent = displayName;
            
            // Open via iframe instead of new tab
            card.onclick = () => {
                launchInIframe(href, displayName);
            };

            container.appendChild(card);
